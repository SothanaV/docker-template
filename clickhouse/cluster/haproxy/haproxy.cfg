global
    maxconn 4096

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 600s # ClickHouse queries can run long; adjust as needed
    timeout server 600s

# -----------------------------------------
# HAProxy Stats Dashboard
# -----------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    # stats auth admin:password # Uncomment to add basic auth

# -----------------------------------------
# ClickHouse HTTP Interface (Port 8123)
# -----------------------------------------
frontend clickhouse_http_front
    bind *:8123
    mode http
    default_backend clickhouse_http_back

backend clickhouse_http_back
    mode http
    balance roundrobin
    # Use ClickHouse's native health check endpoint
    option httpchk GET /ping
    http-check expect status 200
    
    server ch1 clickhouse-01:8123 check
    server ch2 clickhouse-02:8123 check
    server ch3 clickhouse-03:8123 check

# -----------------------------------------
# ClickHouse Native Interface (Port 9000)
# -----------------------------------------
frontend clickhouse_native_front
    bind *:9000
    mode tcp
    default_backend clickhouse_native_back

backend clickhouse_native_back
    mode tcp
    balance roundrobin
    # TCP health checks
    option tcp-check
    
    server ch1 clickhouse-01:9000 check
    server ch2 clickhouse-02:9000 check
    server ch3 clickhouse-03:9000 check
