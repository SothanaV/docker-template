volumes:
  clickhouse-data: {}
services:
  clickhouse:
    container_name: ${PROJECT_NAME}-clickhouse
    image: bitnamilegacy/clickhouse:25.6.2-debian-12-r0
    ports:
      - 8123:8123
    volumes:
      - ./config/override.xml:/bitnami/clickhouse/etc/config.d/override.xml:ro
      - clickhouse-data:/bitnami/clickhouse
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s