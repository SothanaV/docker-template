services:
  databasus:
    container_name: databasus
    image: databasus/databasus:v2.21.0
    ports:
      - "4005:4005"
    volumes:
      - ./databasus-data:/databasus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4005/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s