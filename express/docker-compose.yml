services:
    backend:
        container_name: ${PROJECT_NAME}-backend
        build: ./backend
        command: bash runserver.sh
        volumes:
            - ./backend:/backend
        ports:
            - 3000:3000
        env_file:
            - .env
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s