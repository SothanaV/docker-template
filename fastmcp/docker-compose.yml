services:
  mcp:
    container_name: ${PROJECT_NAME}-mcp
    build: ./server
    command: bash run-server-dev.sh
    volumes:
      - ./server:/backend
    ports:
      - 8080:8000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s