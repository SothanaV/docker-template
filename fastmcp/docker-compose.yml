services:
    mcp:
        container_name: ${PROJECT_NAME}-mcp
        build: ./server
        command: uvicorn --reload --host 0.0.0.0 --port 8000 server:app
        volumes:
            - ./server:/backend
        ports:
            - 8080:8000
        env_file:
            - .env
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/healthz'); sys.exit(0 if r.status==200 else 1)"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
