services: 
    backend:
        container_name: ${PROJECT_NAME}-backend
        build: ./backend
        command: sh run-server-dev.sh
        volumes: 
            - ./backend:/backend
        ports: 
            - 5050:5000
        env_file: 
            - .env
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s