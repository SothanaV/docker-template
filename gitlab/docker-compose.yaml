services:
  gitlab:
    image: 'gitlab/gitlab-ce:18.11.1-ce.0'
    container_name: gitlab
    restart: always
    hostname: 'localhost'
    environment:
        GITLAB_OMNIBUS_CONFIG: |
            external_url 'http://localhost'
    ports:
        - '80:80'         # Web interface
        - '443:443'       # HTTPS (optional)
    volumes:
        - './config:/etc/gitlab'
        - './logs:/var/log/gitlab'
        - './data:/var/opt/gitlab'
        - ./gitlab.rb:/etc/gitlab/gitlab.rb:ro
    healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:80/api/v4/health || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 300s