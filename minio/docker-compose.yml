volumes:
    data: {}
services:
    minio:
        container_name: minio-minio
        image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
        command: server /data/minio1/ --console-address ":9001" 
        ports:
            - 9000:9000
            - 9001:9001
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio123
        volumes:
            - data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s