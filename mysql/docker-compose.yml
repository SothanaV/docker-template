volumes:
  db: {}

services:
  mysql:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}-db
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s