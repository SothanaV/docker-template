volumes:
    media: {}
    static: {}

services: 
    nginx:
        container_name: ${PROJECT_NAME}-nginx
        image: nginx:1.25.2-alpine
        ports:
            - 8000:8000
            - 8080:8080
        volumes:
            - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
            - media:/var/www/media/
            - static:/var/www/static/
        env_file:
            - .env
        environment:
            NGINX_ENVSUBST_TEMPLATE_SUFFIX: ".conf"
        healthcheck:
            test: ["CMD-SHELL", "nginx -t 2>&1 | grep -q 'succeeded'"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s