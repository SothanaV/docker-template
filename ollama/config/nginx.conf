worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    upstream ollama_cluster {
        hash $remote_port consistent;
        server ollama-1:11434;
        server ollama-2:11434;
        server ollama-3:11434;
        server ollama-4:11434;
    }

    log_format custom_log_format '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$upstream_addr"';

    include /etc/nginx/conf.d/*.conf;  # Include all server configs
}