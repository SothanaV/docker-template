volumes:
    data: {}
services:
    oracle:
        image: gvenzl/oracle-free:23-full
        environment:
            - ORACLE_RANDOM_PASSWORD=true
            - APP_USER=my_user
            - APP_USER_PASSWORD=password_i_should_change
        ports:
            - 1521:1521
        volumes:
            - data:/opt/oracle/oradata