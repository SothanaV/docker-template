volumes:
    db: {}

services: 
    db:
        container_name: ${PROJECT_NAME}-db
        image: postgres:18.0-alpine
        volumes:
            - db:/var/lib/postgresql/data
        env_file:
            - .env
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s