server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push



scrape_configs:
  - job_name: api-pdf2text-log-scraper
    static_configs:
      - targets:
          - localhost
        labels:
          job: api-pdf2text
          __path__: /var/log/nginx/access-api.log
  - job_name: web-pdf2text-log-scraper
    static_configs:
      - targets:
          - localhost
        labels:
          job: web-pdf2text
          __path__: /var/log/nginx/access-web.log