services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - 6333:6333 # REST API
      - 6334:6334 # gRPC API
    env_file:
      - .env
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
    name: qdrant_data