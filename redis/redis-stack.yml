volumes:
  redis_db: {}
services: 
    redis:
        container_name: ${PROJECT_NAME}-redis
        image: redis/redis-stack-server:6.2.6-v7
        volumes:
            - redis_db:/data
        ports:
            - 6379:6379 
        env_file:
            - .env

    redis-insight1:
        container_name: ${PROJECT_NAME}-redis-insight
        image: redislabs/redisinsight:1.13.1
        env_file:
            - .env
        ports:
            - 8001:8001

    redis-insight2:
        container_name: ${PROJECT_NAME}-redis-insight
        image: redislabs/redisinsight:2.66
        volumes:
            - redisinsight_data:/data
        env_file:
            - .env
        ports:
            - 5540:5540