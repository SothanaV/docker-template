volumes:
  valkey-data: {}
  insight-data: {}
services:
  valkey:
    image: valkey/valkey:9.0-alpine
    volumes:
      - valkey-data:/valkey
    env_file:
      - .env
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis-insight:
    container_name: redis-insight
    image: redislabs/redisinsight:2.66
    volumes:
      - insight-data:/data
    env_file:
      - .env
    ports:
      - 5540:5540