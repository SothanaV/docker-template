services: 
    frontend:
        container_name: ${PROJECT_NAME}-frontend
        build: ./frontend
        command: sh run_dev.sh
        volumes: 
            - ./frontend:/frontend
        ports: 
            - 5173:5173
        env_file: 
            - .env
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:80/"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 20s